      .note { font-size: 15px; font-weight: 600; }
      .small { font-size: 13px; }
      .box-label { font-size: 16px; font-weight: 600; }
      .apps { font-size: 14px; }
      .stroke { stroke: #475569; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 9 8; }
      .group { stroke: #94a3b8; stroke-width: 2.5; rx: 22; ry: 22; }
      .node { fill: #ffffff; stroke: #64748b; stroke-width: 2; rx: 14; ry: 14; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
