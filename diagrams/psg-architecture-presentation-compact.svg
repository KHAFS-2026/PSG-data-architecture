<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1280" viewBox="0 0 2200 1280" role="img" aria-labelledby="title desc">
  <title id="title">Unified Lakehouse Platform</title>
  <desc id="desc">Presentation-ready architecture diagram showing Data Sources, Ingestion Pipelines, Unified Lakehouse, Master Data Layer, Semantic Models, Power BI Apps, and Governance.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2937; }
